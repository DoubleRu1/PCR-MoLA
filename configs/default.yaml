# Default configuration for PCR-MoLA experiments
# This file contains default values that can be overridden by specific configs

# Training settings
training:
  epochs: 3
  batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  eval_every_steps: 100
  save_every_steps: 500
  logging_steps: 10
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true

# Data settings
data:
  max_length: 128
  max_new_tokens: 16
  num_workers: 4

# Generation settings
generation:
  do_sample: false
  num_beams: 1
  temperature: 1.0
  max_new_tokens: 16

# PCR-MoLA specific settings
pcr_mola:
  # Router projection dimension
  router_dim: 256
  # LoRA rank for experts
  rank: 8
  # Alpha scale for LoRA
  alpha_scale: 32
  # Top-K routing
  top_k: 2
  # Balance loss coefficient
  balance_loss_coef: 0.01
  # Layer-wise expert allocation
  # L1 = floor(L/3), L2 = floor(2L/3)
  # [0, L1): n_experts_low, [L1, L2): n_experts_mid, [L2, L): n_experts_high
  n_experts_low: 2
  n_experts_mid: 4
  n_experts_high: 8
  # Pair feature configuration (for ablation)
  # Options: "full" (all 4), "no_diff" (no h1-h2), "no_interaction" (no h1*h2), "context_only" (only last token)
  pair_features: "full"
  # Dropout for router
  router_dropout: 0.1

# LoRA baseline settings
lora:
  rank: 8
  alpha: 32
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "v_proj"

# LoRAMoE baseline settings
loramoe:
  rank: 8
  alpha: 32
  num_experts: 4
  top_k: 2
  balance_loss_coef: 0.01
  target_modules:
    - "q_proj"
    - "v_proj"

# ICL baseline settings
icl:
  num_exemplars: 5
  exemplar_selection: "random"  # or "stratified"
  use_cot: false

# Output settings
output:
  dir: "outputs"
  save_predictions: true
  save_best_only: true
