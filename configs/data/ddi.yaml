# DDI (Drug-Drug Interaction) dataset configuration
dataset:
  name: "ddi"
  # Path to data directory
  data_dir: "data/ddi"
  # Hugging Face dataset (alternative)
  hf_dataset: null
  # Label configuration
  labels_file: "data/labels/ddi.json"
  # Entity markers
  entity_markers:
    e1_start: "<e1>"
    e1_end: "</e1>"
    e2_start: "<e2>"
    e2_end: "</e2>"
  # Task description for prompt
  task_description: "Classify the drug-drug interaction type between the marked entities."
  # Label set (will be loaded from labels_file)
  # DDI relation types:
  # mechanism - PK mechanism interaction
  # effect - PD effect interaction
  # advise - Recommendation/Advice
  # int - General interaction
  # false - No interaction
