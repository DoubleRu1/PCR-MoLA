[project]
name = "pcr-mola"
version = "0.1.0"
description = "PCR-MoLA: Entity Pair-Conditioned Routing with Layer-wise Adaptive Expert Allocation for LoRA-MoE"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PCR-MoLA Authors"}
]
keywords = ["nlp", "relation-extraction", "lora", "moe", "transformers"]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
    "peft>=0.10.0",
    "datasets>=2.18.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "jsonlines>=4.0.0",
    "tabulate>=0.9.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
deepspeed = [
    "deepspeed>=0.14.0",
]
flash-attn = [
    "flash-attn>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
]
all = [
    "pcr-mola[deepspeed,flash-attn,dev]",
]

[project.scripts]
pcr-train = "src.train:main"
pcr-eval = "src.eval:main"
pcr-sweep = "src.run_sweep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008"]
